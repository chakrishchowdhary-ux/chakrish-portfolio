<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chakrish Nallabothula – Civil Engineer & Tech Innovator</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --yellow: #FFBE00;
    --yellow-light: #FFD54F;
    --dark: #111111;
    --dark2: #1a1a1a;
    --gray: #555;
    --light-bg: #f5f5f5;
    --white: #ffffff;
    --text: #333;
    --sidebar-w: 260px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--light-bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* ─── SIDEBAR ─── */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--white);
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 4px 0 20px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 20px 28px;
    animation: slideIn .6s ease both;
  }
  @keyframes slideIn { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }

  .avatar-wrap {
    position: relative;
    margin-bottom: 14px;
  }
  .avatar-wrap img {
    width: 100px; height: 100px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid var(--yellow);
  }
  .avatar-badge {
    position: absolute; bottom: 4px; right: 4px;
    width: 18px; height: 18px;
    background: #22c55e;
    border-radius: 50%;
    border: 2px solid white;
  }

  .sb-name {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    text-align: center;
    color: var(--dark);
  }
  .sb-title {
    font-size: .78rem;
    color: var(--gray);
    margin-top: 2px;
    text-align: center;
  }

  .socials {
    display: flex; gap: 8px;
    margin: 16px 0;
    flex-wrap: wrap;
    justify-content: center;
  }
  .socials a {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--light-bg);
    display: flex; align-items: center; justify-content: center;
    color: var(--dark);
    font-size: .78rem;
    transition: .2s;
    text-decoration: none;
  }
  .socials a:hover { background: var(--yellow); color: var(--dark); transform: translateY(-2px); }

  .info-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 18px;
    font-size: .78rem;
  }
  .info-table tr td { padding: 5px 4px; }
  .info-table tr td:first-child {
    background: var(--yellow);
    font-weight: 600;
    border-radius: 3px;
    padding: 4px 8px;
    white-space: nowrap;
    font-size: .72rem;
    color: var(--dark);
  }
  .info-table tr td:last-child {
    padding-left: 10px;
    color: var(--gray);
  }
  .available { color: #22c55e !important; font-weight: 600; }

  .sb-section-title {
    font-family: 'Syne', sans-serif;
    font-size: .82rem;
    font-weight: 700;
    color: var(--dark);
    width: 100%;
    margin: 12px 0 8px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .skill-row { width: 100%; margin-bottom: 10px; }
  .skill-label { display: flex; justify-content: space-between; font-size: .74rem; margin-bottom: 4px; color: var(--dark); font-weight: 500; }
  .skill-bar { height: 5px; background: #e8e8e8; border-radius: 99px; overflow: hidden; }
  .skill-fill {
    height: 100%;
    background: var(--yellow);
    border-radius: 99px;
    width: 0;
    transition: width 1.2s cubic-bezier(.4,0,.2,1);
  }

  .extra-skills { width: 100%; list-style: none; }
  .extra-skills li {
    font-size: .75rem;
    color: var(--gray);
    padding: 3px 0;
    display: flex; align-items: center; gap: 7px;
  }
  .extra-skills li::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--yellow);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .download-btn {
    display: flex; align-items: center; gap: 8px;
    background: var(--yellow);
    color: var(--dark);
    font-family: 'Syne', sans-serif;
    font-size: .8rem;
    font-weight: 700;
    padding: 10px 22px;
    border-radius: 4px;
    text-decoration: none;
    margin-top: 18px;
    transition: .2s;
    text-transform: uppercase;
    letter-spacing: .05em;
    width: 100%;
    justify-content: center;
  }
  .download-btn:hover { background: var(--dark); color: var(--yellow); }

  /* ─── RIGHT NAV ─── */
  .right-nav {
    position: fixed;
    right: 0; top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 0;
    z-index: 100;
    background: var(--white);
    border-radius: 8px 0 0 8px;
    box-shadow: -2px 0 12px rgba(0,0,0,.08);
    overflow: hidden;
  }
  .right-nav a {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    color: var(--gray);
    font-size: .9rem;
    text-decoration: none;
    transition: .2s;
    border-bottom: 1px solid #f0f0f0;
  }
  .right-nav a:last-child { border-bottom: none; }
  .right-nav a.active, .right-nav a:hover { background: var(--yellow); color: var(--dark); }

  /* ─── MAIN CONTENT ─── */
  main {
    margin-left: var(--sidebar-w);
    margin-right: 44px;
    flex: 1;
    padding: 0 0 60px;
  }

  /* ─── HERO ─── */
  .hero {
    background: var(--white);
    padding: 60px 50px 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 40px;
    position: relative;
    overflow: hidden;
    min-height: 340px;
    animation: fadeUp .7s ease both;
  }
  @keyframes fadeUp { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

  .hero-bg-shape {
    position: absolute;
    top: -60px; right: 200px;
    width: 280px; height: 280px;
    border-radius: 50%;
    background: var(--yellow);
    opacity: .07;
    pointer-events: none;
  }
  .hero-dots {
    position: absolute;
    font-size: 1.2rem;
    color: var(--yellow);
    opacity: .5;
  }
  .hero-dots.d1 { top: 30px; right: 320px; }
  .hero-dots.d2 { bottom: 40px; right: 260px; font-size: .9rem; }
  .hero-dots.d3 { top: 80px; right: 240px; font-size: .7rem; }

  .hero-text { flex: 1; }
  .hero-greeting {
    font-size: .9rem;
    color: var(--gray);
    margin-bottom: 8px;
    font-weight: 300;
  }
  .hero-text h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.6rem;
    font-weight: 800;
    color: var(--dark);
    line-height: 1.15;
    margin-bottom: 16px;
  }
  .hero-text h1 span { color: var(--yellow); }
  .hero-text p {
    font-size: .9rem;
    color: var(--gray);
    line-height: 1.7;
    max-width: 400px;
    margin-bottom: 28px;
  }
  .hire-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--yellow);
    color: var(--dark);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: .85rem;
    padding: 12px 28px;
    border-radius: 4px;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: .06em;
    transition: .2s;
  }
  .hire-btn:hover { background: var(--dark); color: var(--yellow); }
  .hire-btn i { font-size: .75rem; }

  .hero-photo {
    flex-shrink: 0;
    width: 280px; height: 280px;
    position: relative;
  }
  .hero-photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 8px;
    filter: grayscale(10%);
  }
  .hero-photo-badge {
    position: absolute;
    bottom: -14px; left: -14px;
    background: var(--yellow);
    color: var(--dark);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: .75rem;
    padding: 10px 14px;
    border-radius: 6px;
    line-height: 1.3;
    box-shadow: 0 4px 16px rgba(255,190,0,.4);
  }

  /* ─── SECTION WRAPPER ─── */
  section {
    padding: 60px 50px;
    animation: fadeUp .7s ease both;
  }
  section:nth-child(even) { background: var(--white); }

  .section-head {
    text-align: center;
    margin-bottom: 40px;
  }
  .section-head h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--dark);
  }
  .section-head p {
    font-size: .88rem;
    color: var(--gray);
    margin-top: 10px;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.7;
  }
  .underline-yellow {
    display: inline-block;
    width: 40px; height: 3px;
    background: var(--yellow);
    border-radius: 99px;
    margin: 10px auto 0;
  }

  /* ─── SERVICES ─── */
  .services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .service-card {
    background: var(--light-bg);
    border-radius: 8px;
    padding: 28px 22px;
    transition: .25s;
    border: 2px solid transparent;
    cursor: default;
  }
  .service-card:hover {
    border-color: var(--yellow);
    background: var(--white);
    transform: translateY(-4px);
    box-shadow: 0 8px 28px rgba(255,190,0,.15);
  }
  .service-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,190,0,.12);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    font-size: 1.3rem;
    color: var(--yellow);
    border: 2px solid var(--yellow);
  }
  .service-card h3 {
    font-family: 'Syne', sans-serif;
    font-size: .98rem;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--dark);
  }
  .service-card p {
    font-size: .78rem;
    color: var(--gray);
    line-height: 1.6;
  }

  /* ─── PROJECTS ─── */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .project-card {
    background: var(--white);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
    transition: .25s;
    border: 2px solid transparent;
  }
  .project-card:hover {
    border-color: var(--yellow);
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(255,190,0,.12);
  }
  .project-thumb {
    height: 160px;
    background: linear-gradient(135deg, var(--dark) 0%, #2a2a2a 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.5rem;
    color: var(--yellow);
    position: relative;
    overflow: hidden;
  }
  .project-thumb::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 50%, rgba(255,190,0,.1) 0%, transparent 60%);
  }
  .project-body { padding: 20px; }
  .project-tag {
    display: inline-block;
    background: rgba(255,190,0,.15);
    color: #b8860b;
    font-size: .7rem;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 99px;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .project-body h3 {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--dark);
  }
  .project-body p {
    font-size: .8rem;
    color: var(--gray);
    line-height: 1.6;
  }

  /* ─── ACHIEVEMENTS ─── */
  .achievements-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .ach-card--merit {
    background: linear-gradient(145deg, #1a1200, #2a1e00);
    border: 1.5px solid rgba(255,190,0,.35);
  }
  .ach-ribbon {
    position: absolute;
    top: 14px; right: -22px;
    background: var(--yellow);
    color: var(--dark);
    font-family: 'Syne', sans-serif;
    font-size: .62rem;
    font-weight: 800;
    padding: 3px 30px;
    transform: rotate(45deg);
    letter-spacing: .08em;
    box-shadow: 0 2px 8px rgba(255,190,0,.4);
  }
  .ach-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
  }
  .ach-tags span {
    background: rgba(255,190,0,.15);
    color: var(--yellow);
    font-size: .65rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid rgba(255,190,0,.25);
  }
  .ach-card {
    border-radius: 10px;
    padding: 28px 22px;
    background: var(--dark);
    color: var(--white);
    position: relative;
    overflow: hidden;
    transition: .25s;
  }
  .ach-card::before {
    content: '';
    position: absolute; top: -20px; right: -20px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: rgba(255,190,0,.15);
  }
  .ach-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,.2); }
  .ach-num {
    font-family: 'Syne', sans-serif;
    font-size: 2.2rem;
    font-weight: 800;
    color: var(--yellow);
    line-height: 1;
    margin-bottom: 6px;
  }
  .ach-card h3 {
    font-family: 'Syne', sans-serif;
    font-size: .9rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .ach-card p { font-size: .78rem; color: #aaa; line-height: 1.5; }

  /* ─── EDUCATION ─── */
  .edu-timeline { position: relative; padding-left: 28px; }
  .edu-timeline::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: linear-gradient(to bottom, var(--yellow), transparent);
  }
  .edu-item {
    position: relative;
    margin-bottom: 32px;
    padding: 22px 24px;
    background: var(--white);
    border-radius: 8px;
    box-shadow: 0 2px 12px rgba(0,0,0,.05);
    transition: .2s;
  }
  section:nth-child(even) .edu-item { background: var(--light-bg); }
  .edu-item:hover { transform: translateX(4px); box-shadow: 0 6px 20px rgba(255,190,0,.1); }
  .edu-item::before {
    content: '';
    position: absolute;
    left: -34px; top: 24px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--yellow);
    border: 2px solid var(--white);
    box-shadow: 0 0 0 3px var(--yellow);
  }
  .edu-year {
    display: inline-block;
    background: var(--yellow);
    color: var(--dark);
    font-size: .7rem;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 99px;
    margin-bottom: 8px;
  }
  .edu-item h3 {
    font-family: 'Syne', sans-serif;
    font-size: .98rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 4px;
  }
  .edu-item .inst { font-size: .82rem; color: var(--gray); margin-bottom: 6px; }
  .edu-item p { font-size: .8rem; color: var(--gray); line-height: 1.6; }
  .edu-badge {
    position: absolute; top: 18px; right: 18px;
    background: rgba(255,190,0,.12);
    color: #b8860b;
    font-size: .72rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 99px;
  }
  .edu-year-bold {
    margin-top: 12px;
    font-family: 'Syne', sans-serif;
    font-size: .95rem;
    color: var(--yellow);
    letter-spacing: .04em;
  }
  .edu-year-bold strong {
    font-weight: 800;
  }

  /* ─── CONTACT ─── */
  .contact-card {
    display: flex; align-items: center; gap: 16px;
    background: var(--light-bg);
    border-radius: 8px;
    padding: 20px;
    transition: .2s;
    text-decoration: none;
    color: inherit;
    border: 2px solid transparent;
  }
  .contact-card:hover {
    border-color: var(--yellow);
    background: var(--white);
    transform: translateY(-2px);
  }
  .contact-icon {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    color: var(--dark);
    flex-shrink: 0;
  }
  .contact-card h4 {
    font-family: 'Syne', sans-serif;
    font-size: .82rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 2px;
  }
  .contact-card p { font-size: .78rem; color: var(--gray); }

  /* ─── CONTACT LAYOUT ─── */
  #contact {
    background: var(--light-bg) !important;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
  }
  .contact-layout {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 32px;
    align-items: start;
  }
  .contact-info { display: flex; flex-direction: column; gap: 14px; }

  /* ─── CONTACT FORM ─── */
  .contact-form-wrap {
    background: var(--white);
    border-radius: 12px;
    padding: 32px 30px;
    box-shadow: 0 4px 24px rgba(0,0,0,.07);
  }
  .form-header { margin-bottom: 22px; }
  .form-header h3 {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 4px;
  }
  .form-header p { font-size: .82rem; color: var(--gray); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-group { display: flex; flex-direction: column; margin-bottom: 16px; }
  .form-group label {
    font-size: .78rem;
    font-weight: 600;
    color: var(--dark);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .form-group label span { color: var(--yellow); }
  .form-group input,
  .form-group textarea {
    border: 1.5px solid #e8e8e8;
    border-radius: 6px;
    padding: 11px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: .86rem;
    color: var(--dark);
    background: var(--light-bg);
    transition: .2s;
    outline: none;
    resize: none;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    border-color: var(--yellow);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(255,190,0,.12);
  }
  .form-group input::placeholder,
  .form-group textarea::placeholder { color: #bbb; font-size: .83rem; }

  .submit-btn {
    width: 100%;
    padding: 13px;
    background: var(--yellow);
    color: var(--dark);
    font-family: 'Syne', sans-serif;
    font-size: .88rem;
    font-weight: 700;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: .2s;
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-top: 4px;
  }
  .submit-btn:hover { background: var(--dark); color: var(--yellow); }
  .submit-btn:disabled { opacity: .6; cursor: not-allowed; }

  .form-success, .form-error {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: .84rem;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .form-success {
    background: #f0fdf4;
    border: 1.5px solid #86efac;
    color: #166534;
  }
  .form-success i { color: #22c55e; font-size: 1.2rem; }
  .form-error {
    background: #fff1f2;
    border: 1.5px solid #fca5a5;
    color: #991b1b;
  }
  .form-error i { color: #ef4444; font-size: 1.2rem; }
  .form-error a { color: var(--dark); font-weight: 600; }

  @media (max-width: 900px) {
    .contact-layout { grid-template-columns: 1fr; }
    .contact-info { flex-direction: column; }
  }
  @media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
  }

  /* ─── FOOTER ─── */
  footer {
    background: var(--dark);
    color: #888;
    text-align: center;
    padding: 28px 50px;
    font-size: .78rem;
    margin-left: 0;
  }
  footer span { color: var(--yellow); }
  .footer-socials {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .footer-socials a {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center;
    color: #aaa;
    font-size: .9rem;
    text-decoration: none;
    transition: .2s;
    border: 1px solid rgba(255,255,255,.1);
  }
  .footer-socials a:hover { background: var(--yellow); color: var(--dark); transform: translateY(-3px); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 900px) {
    .sidebar { width: 100%; position: relative; height: auto; }
    main { margin-left: 0; margin-right: 0; }
    body { flex-direction: column; }
    .right-nav { display: none; }
